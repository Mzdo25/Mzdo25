<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24">
  <defs>
    <filter id="laser-glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0" />
      <stop offset="20%" stop-color="#00FF66" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7EE787" stop-opacity="1" />
      <stop offset="80%" stop-color="#00FF66" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulse-node {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.4); opacity: 1; }
    }
    @keyframes sweep {
      0% { transform: translateX(-100px); }
      100% { transform: translateX(1000px); }
    }
    .node {
      transform-origin: center;
      animation: pulse-node 2s ease-in-out infinite;
    }
    .beam {
      animation: sweep 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>

  <!-- Baseline track -->
  <line x1="0" y1="12" x2="900" y2="12" stroke="#161b22" stroke-width="2" />
  <line x1="100" y1="12" x2="800" y2="12" stroke="url(#line-grad)" stroke-width="1.5" filter="url(#laser-glow)" />

  <!-- Center Diamond Nodes -->
  <polygon class="node" points="450,4 458,12 450,20 442,12" fill="#00FF66" filter="url(#laser-glow)" />
  <polygon class="node" points="450,7 455,12 450,17 445,12" fill="#ffffff" />

  <polygon points="250,8 254,12 250,16 246,12" fill="#00FF66" opacity="0.6" />
  <polygon points="650,8 654,12 650,16 646,12" fill="#00FF66" opacity="0.6" />

  <!-- Moving Laser Beam -->
  <circle class="beam" cx="0" cy="12" r="3.5" fill="#ffffff" filter="url(#laser-glow)" />
</svg>
